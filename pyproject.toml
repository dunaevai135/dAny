[project]
name = "dany6-sim"
version = "0.1.0"
description = "Генератор dN-кубиков и Монте-Карло проверка их честности"
readme = "README.md"
authors = [
    { name = "dunaev.aleksey6", email = "dunaev.aleksey6@rwb.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "cadquery>=2.8.0",
    "imageio>=2.38.0",
    "imageio-ffmpeg>=0.6.0",
    "mujoco>=3.15.0",
]

[project.scripts]
dice-sim = "dany6_sim.sim:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
